# query useTrustedNetworksQuery  (GroupChatMembers-DVwodGky.js)
query useTrustedNetworksQuery(
  $contactsCursor: String
  $requestsCursor: String
  $blockedCursor: String
  $groupsCursor: String
) {
  trustedNetworkGroups(limit: 5, cursor: $groupsCursor) {
    items {
      id
      displayName
      memberCount
      members {
        handle
        name
        you
      }
      request {
        id
        generation
        status
      }
    }
    cursor
  }
  agentToAgentSettings {
    enabled
  }
  trustedNetworkBlockedPeople(limit: 20, cursor: $blockedCursor) {
    items {
      id
      decisionGeneration
      displayName
      phoneNumbers
      createdAt
    }
    cursor
  }
  trustedNetworkContacts(limit: 20, cursor: $contactsCursor) {
    items {
      id
      generation
      displayName
      phoneNumbers
      createdAt
    }
    cursor
  }
  trustedNetworkSentRequests(limit: 20) {
    id
    phoneNumber
    createdAt
    expiresAt
  }
  trustedNetworkRequests(limit: 20, cursor: $requestsCursor) {
    items {
      id
      generation
      status
      displayName
      phoneNumbers
      createdAt
      expiresAt
      returnSmsPhoneNumber
      returnWhatsAppPhoneNumber
    }
    cursor
  }
}

