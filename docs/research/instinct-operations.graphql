# query useChatHistoryQuery  (AgentChatPage-CmhyiyT0.js)
query useChatHistoryQuery(
  $chatId: ID!
  $source: ChatSource
  $limit: Int
  $cursor: String
) {
  chat(chatId: $chatId) {
    source
    status
    pendingInteractionId
    id
  }
  chatHistory(chatId: $chatId, source: $source, limit: $limit, cursor: $cursor) {
    pendingTurnStartedAt
    cursor
    events {
      id
      type
      createdAt
      message {
        id
        role
        ingressEventId
        readAt
        content
        origin {
          kind
          agentId
          agentKind
          agentDisplayName
        }
        attachments {
          id
          kind
          mimeType
          filename
          byteSize
          signedUrl
        }
        sentDraftEdits {
          chatEventId
          label
        }
      }
      error {
        message
      }
      toolInvocation {
        toolName
        toolId
        arguments
      }
      toolResponse {
        toolName
        toolId
        response
        actionType
        isError
      }
      interaction {
        interactionId
        interactionType
        title
        body
        payloadJson
        question
        options
        actionSummary
        targetMode
        deviceName
        plan
      }
      interactionResponse {
        interactionId
        approved
        selected
        text
        payloadJson
        summary
        dismissed
      }
      screenshot {
        url
      }
      thinking {
        thinking
      }
      action {
        actionType
        coordinate
        text
        key
        scrollDirection
        scrollAmount
        command
      }
      draftField {
        label
        before
        content
        userValue
        userEditedAt
      }
    }
  }
}

