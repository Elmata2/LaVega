name: catalog sweep
on:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC — terms move yearly, not daily
  workflow_dispatch: # and on demand, because the first runs need watching
permissions:
  contents: write
# A manual dispatch racing the Monday cron would give two jobs committing and
# pushing the same two files; the second push then fails on a branch that moved
# under it. One at a time, and never cancel a run mid-sweep — a cancelled sweep
# writes nothing at all (both writes are after the loop), but a cancelled COMMIT
# would leave the pair half-written.
concurrency:
  group: catalog-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    # The sweep's own worst case is ~80 minutes (98 routes x a 20s timeout, plus
    # pdftotext). The default is six hours, which is a long time to hold a runner
    # for a job that has already hung.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils # pdftotext
      - run: pnpm install --frozen-lockfile
      - run: pnpm catalog:sweep
      - name: Commit whatever changed
        run: |
          git config user.name  "lavega-catalog"
          git config user.email "noreply@lavega.dev"
          git add docs/catalog/catalog.json docs/catalog/state.json
          git diff --staged --quiet || git commit -m "chore(catalog): weekly sweep"
          git push
