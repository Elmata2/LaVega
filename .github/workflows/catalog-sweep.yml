name: catalog sweep
on:
  schedule:
    # Sunday 01:00 UTC (02:00 or 03:00 Dutch time): done before Monday, with time for a second run if the first fails
    - cron: "0 1 * * 0"
  workflow_dispatch: # and on demand, because the first runs need watching
# No top-level permissions: each job asks for exactly what it needs.
permissions: {}
# A manual dispatch racing the scheduled cron would give two jobs committing and
# pushing the same two files; the second push then fails on a branch that moved
# under it. One at a time, and never cancel a run mid-sweep — a cancelled sweep
# writes nothing at all (both writes are after the loop), but a cancelled COMMIT
# would leave the pair half-written.
concurrency:
  group: catalog-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    # Four products are read at the same time (CATALOG_CONCURRENCY). Measured 45 minutes
    # and $1.77 for the FX and interest questions alone with an empty answer cache (2026-11-22);
    # the fee, points and cashback passes add to that. See docs/catalog/watchlist.md.
    # The default limit is six hours, which is a long time to hold a runner for a
    # job that has already hung.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.4" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils # pdftotext
      - run: bun install --frozen-lockfile
      # The only step that gets the model key.
      - name: Sweep
        # Shorter than the job, so a hung sweep ends as a failed STEP and the Report step still runs.
        timeout-minutes: 165
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CATALOG_MAX_USD: "8"
          CATALOG_MODEL: mistral-large-latest
          CATALOG_FALLBACK_MODEL: mistral-medium-latest
          CATALOG_CONCURRENCY: "4"
          # No new product starts after 150 minutes; the ones running finish and the run is written.
          # The fee, points and cashback passes stop starting figures 20 minutes earlier (130), so the FX and
          # interest results are written before the step timeout.
          CATALOG_DEADLINE_MIN: "150"
        run: bun run catalog:sweep -- --summary-out "$RUNNER_TEMP/catalog-summary.json"
      - name: Commit whatever changed
        id: commit
        run: |
          git config user.name  "lavega-catalog"
          git config user.email "noreply@lavega.dev"
          git add docs/catalog/catalog.json docs/catalog/state.json
          [ -f docs/catalog/model-cache.json ] && git add docs/catalog/model-cache.json
          git diff --staged --quiet || git commit -m "chore(catalog): weekly sweep"
          # A commit that landed during the run must not fail the push; a failed rebase fails the step.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
      # Always runs: a refused or crashed sweep still gets its issue.
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_FAILED: ${{ steps.commit.outcome == 'failure' && '--push-failed' || '' }}
        run: bun run catalog:report -- --summary "$RUNNER_TEMP/catalog-summary.json" $PUSH_FAILED
  # Independent of `sweep`: a failed sweep must not skip this, and this only
  # ever writes a GitHub issue, never the repo.
  business-savings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.4" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bun run business-savings:watch
