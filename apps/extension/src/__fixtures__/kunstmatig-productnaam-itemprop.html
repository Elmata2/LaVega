<!-- KUNSTMATIG. Microdata itemprop="name" binnen een itemtype dat Product
     bevat, zonder JSON-LD en zonder og:title — de derde en laatste tak van de
     productnaam-extractie. De organisatienaam in de footer staat BUITEN de
     Product-itemscope en mag niet als productnaam worden gelezen. -->
<!doctype html><html lang="nl"><head><title>Winkel</title></head>
<body>
<div itemscope itemtype="https://schema.org/Product">
  <span itemprop="name">Boombox 4 25W bluetooth speaker</span>
  <span itemprop="price" content="199.00">€ 199,00</span>
</div>
<footer itemscope itemtype="https://schema.org/Organization">
  <span itemprop="name">Voorbeeldwinkel B.V.</span>
</footer>
</body></html>
