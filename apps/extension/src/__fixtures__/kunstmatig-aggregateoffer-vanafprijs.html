<!-- KUNSTMATIG. Een AggregateOffer met alleen een lowPrice: een "vanaf"-prijs.
     De bovenkant staat er niet, en ONBEKEND IS NIET GELIJK AAN DE ONDERKANT.
     Dus geen lezing, met de reeks als reden. -->
<!doctype html>
<html lang="nl">
  <head>
    <title>Artikel vanaf</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "O",
        "offers": {
          "@type": "AggregateOffer",
          "lowPrice": "219.00",
          "offerCount": 9,
          "priceCurrency": "EUR"
        }
      }
    </script>
  </head>
  <body>
    <h1>Artikel vanaf &euro; 219,00</h1>
  </body>
</html>
