<!-- KUNSTMATIG. Hoe de aanbiedingenpagina eruitziet als hij niet is ingelogd.

     Dit pad kan twee vormen hebben en alleen de tweede komt hier terecht:
     Amex kan doorsturen naar een inlogadres (dan draait ons script daar niet
     eens, want het matchpatroon staat op /offers/eligible), of het inlogscherm
     in de pagina zelf zetten. Deze fixture is die tweede vorm.

     Waar de lezer op afgaat is de AANWEZIGHEID van een wachtwoordveld, niet de
     tekst eromheen. Dat is een positieve vaststelling: "geen wachtwoordveld
     gezien" betekent niet "hij is ingelogd", en die twee worden in de code niet
     door elkaar gehaald. De waarde van het veld wordt nergens gelezen. -->
<!doctype html>
<html lang="nl">
  <head>
    <title>Inloggen</title>
  </head>
  <body class="color-surface-bg">
    <div id="root">
      <main id="mainContent">
        <h1>Log in om je aanbiedingen te zien</h1>
        <form>
          <label for="uid">Gebruikersnaam</label>
          <input id="uid" type="text" name="UserID" autocomplete="username" />
          <label for="pwd">Wachtwoord</label>
          <input id="pwd" type="password" name="Password" autocomplete="current-password" />
          <button type="submit">Inloggen</button>
        </form>
      </main>
    </div>
  </body>
</html>
