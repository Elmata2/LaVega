<!-- KUNSTMATIG, maar doodgewoon: een JSON-LD Offer van € 49,99 én een
     og-achtige meta met hetzelfde bedrag, waarbij de bijbehorende
     currency-meta ontbreekt. Eén bedrag, twee keer genoemd.

     Voor de reparatie ontdubbelde de lezer op "centen|munt", zag daardoor twee
     verschillende sleutels (49,99 EUR en 49,99 zonder munt) en weigerde met
     "De pagina noemt meer dan één bedrag" — een oorzaak die er niet is, en een
     eenduidige lezing die werd weggegooid. -->
<!doctype html>
<html lang="nl">
  <head>
    <title>Artikel</title>
    <meta property="product:price:amount" content="49.99" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "L",
        "offers": { "@type": "Offer", "price": "49.99", "priceCurrency": "EUR" }
      }
    </script>
  </head>
  <body>
    <h1>Artikel</h1>
  </body>
</html>
