<!-- KUNSTMATIG. Een pagina zonder JSON-LD Product maar met een og:title —
     dezelfde vorm als mediamarkt-alleen-og-titel.html, alleen daar staat
     og:title leeg (client-side gerenderd) en hier gevuld, om de og:title-tak
     van de productnaam-extractie te kunnen bewijzen. -->
<!doctype html>
<html lang="nl">
  <head>
    <title>Winkel — artikelpagina</title>
    <meta property="og:title" content="JBL Tune Flex 2 TWS oordopjes zwart" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "BreadcrumbList",
        "itemListElement": [{ "@type": "ListItem", "position": 1, "name": "Audio" }]
      }
    </script>
  </head>
  <body>
    <h1>JBL Tune Flex 2 TWS oordopjes zwart</h1>
  </body>
</html>
