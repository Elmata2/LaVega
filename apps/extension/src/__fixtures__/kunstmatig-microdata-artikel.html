<!-- KUNSTMATIG. Microdata met itemprop="price" en priceCurrency in dezelfde
     itemscope. Geen van de opgevraagde winkels gebruikte microdata voor de
     prijs, dus dit pad is niet in het wild gemeten — het staat er omdat de
     schema.org-microdatavorm nog voorkomt en de lezer hem aankan. -->
<!doctype html><html lang="nl"><head><title>Artikel</title></head><body>
<div itemscope itemtype="https://schema.org/Product">
  <span itemprop="name">Een ding</span>
  <div itemscope itemtype="https://schema.org/Offer">
    <meta itemprop="priceCurrency" content="EUR">
    <span itemprop="price" content="89.95">&euro; 89,95</span>
  </div>
</div>
</body></html>
