<!-- KUNSTMATIG. De Open Graph product-meta's. MediaMarkt had og-meta's maar
     GEEN og:price:amount (zie mediamarkt-alleen-og-titel.html); dit is hoe het
     eruitziet als een winkel ze wel zet. -->
<!doctype html>
<html lang="nl">
  <head>
    <title>Artikel</title>
    <meta property="product:price:amount" content="1.234,50" />
    <meta property="product:price:currency" content="USD" />
  </head>
  <body>
    <h1>Artikel</h1>
  </body>
</html>
