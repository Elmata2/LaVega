<!-- KUNSTMATIG. Een Offer zonder eigen price, met een
     DeliveryChargeSpecification van € 4,95. Het artikel kost € 1.249,00 maar
     dat staat alleen in de tekst, niet in de opmaak.

     Voor de reparatie las de lezer {"ok":true,"amountCents":495} en rekende het
     paneel de cashback over de verzendkosten uit. Stil, klein en volledig
     verkeerd. -->
<!doctype html>
<html lang="nl">
  <head>
    <title>Wasmachine</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "I",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "EUR",
          "priceSpecification": {
            "@type": "DeliveryChargeSpecification",
            "price": "4.95",
            "priceCurrency": "EUR"
          }
        }
      }
    </script>
  </head>
  <body>
    <h1>Wasmachine &mdash; &euro; 1.249,00</h1>
  </body>
</html>
